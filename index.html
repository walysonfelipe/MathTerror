<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MathTerror</title>
    <meta name="description" content="Treine contas em um jogo de terror: corra, resolva adição, subtração, multiplicação, divisão e tabuada e sobreviva ao MathTerror." />
    <link rel="canonical" href="https://mathterror.walysonassis.online/" />
    <link rel="icon" type="image/png" sizes="64x64" href="assets/images/favicon.png" />

    <!-- Tela cheia no iPhone: aberto pela Tela de Início roda sem as barras do Safari -->
    <link rel="manifest" href="manifest.json?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/icon-180.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MathTerror" />
    <meta name="theme-color" content="#08090a" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="MathTerror" />
    <meta property="og:title" content="MathTerror — Fuga Infernal" />
    <meta property="og:description" content="Aprenda Cálculo 1 em um jogo de terror. Corra, resolva desafios matemáticos e sobreviva à Fuga Infernal." />
    <meta property="og:url" content="https://mathterror.walysonassis.online/" />
    <meta property="og:image" content="https://mathterror.walysonassis.online/assets/images/mathog.jpg" />
    <meta property="og:image:secure_url" content="https://mathterror.walysonassis.online/assets/images/mathog.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />
    <meta property="og:image:alt" content="MathTerror: corujas enfrentam desafios matemáticos em um cenário de terror." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MathTerror — Fuga Infernal" />
    <meta name="twitter:description" content="Aprenda Cálculo 1 em um jogo de terror. Corra, resolva desafios matemáticos e sobreviva à Fuga Infernal." />
    <meta name="twitter:image" content="https://mathterror.walysonassis.online/assets/images/mathog.jpg" />

    <!-- Tipografia "horror" -->

    <link rel="stylesheet" href="style.css" />
    <!-- Deixa os recursos da tela de fim de jogo prontos antes da primeira partida. -->
    <link rel="preload" as="image" href="assets/images/gameover-panel.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/images/gameover-buttons.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/images/digits-sheet.webp" fetchpriority="high" />
</head>

<body class="is-loading">
    <div id="loadingIntro" class="loading-intro" role="status" aria-label="Carregando MathTerror">
        <img src="assets/images/logo.webp" alt="MathTerror" class="loading-logo" fetchpriority="high" />
    </div>

    <!-- Vídeo de background -->
    <video id="bgVideo" class="bg-video" autoplay muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback>
        <!-- Versão leve, usada em todas as plataformas para funcionar offline. -->
        <source src="assets/videos/menu-mobile.mp4" type="video/mp4" />
        Seu navegador não suporta vídeo HTML5.
    </video>

    <!-- Vídeo de fundo da partida (troca com o do menu em js/game-state.js) -->
    <video id="gameVideo" class="bg-video game-video" muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback>
        <source src="assets/videos/game-bg.mp4" type="video/mp4" />
    </video>

    <!-- Efeitos -->
    <div class="fx-vignette" aria-hidden="true"></div>
    <div class="fx-noise" aria-hidden="true"></div>

    <!-- Botão de FULLSCREEN (fixo topo direito) -->
    <button id="fullscreenBtn" class="btn btn--blood floating-fullscreen" aria-pressed="false"
        aria-label="Alternar tela cheia">
        ⛶
    </button>

    <div class="game-header" aria-label="Configurações do jogo">
        <div id="gamepadSideStatus" class="gamepad-side-status" aria-hidden="true" hidden></div>
        <button id="soundBtn" class="btn utility" aria-pressed="false">Som desligado</button>
    </div>
    <div id="gamepadStatus" class="gamepad-status is-disconnected" role="status" aria-live="polite" aria-label="Controle desconectado" hidden>
        <span class="gamepad-status-sr">Controle desconectado</span>
    </div>
    <main class="overlay">
        <div class="menu-reticle" aria-hidden="true"></div>
        <div class="game-menu">
            
            <img src="assets/images/logo.webp" alt="MathTerror" class="logo" />
            
            <nav class="controls" aria-label="Menu principal">
                <button id="runnerBtn" class="start-button" type="button"><span class="start-button-label">Iniciar fuga infernal</span></button>
            </nav>
        </div>
        
    </main>

    <!-- Aviso para deitar o celular (só aparece em celular na vertical) -->
    <div id="rotateScreen" class="rotate-screen" role="alertdialog" aria-labelledby="rotateTitle">
        <div class="rotate-phone" aria-hidden="true"></div>
        <h2 class="rotate-title" id="rotateTitle">Gire o celular</h2>
        <p class="rotate-text">MathTerror é jogado com o celular deitado.</p>
        <button id="rotateBtn" class="btn btn--blood-primary" type="button">Jogar em tela cheia</button>
    </div>

    <!-- iPhone: como jogar em tela cheia (Safari não tem tela cheia para sites) -->
    <div id="installModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="installTitle" hidden>
        <div class="modal">
            <h2 class="modal-title" id="installTitle">Jogar em tela cheia</h2>
            <p class="modal-text">No iPhone, toque em <strong>Compartilhar</strong> <span aria-hidden="true">(□↑)</span> e depois em <strong>Adicionar à Tela de Início</strong>. Abra o MathTerror pelo ícone criado para jogar sem as barras do Safari.</p>
            <div class="modal-actions">
                <button id="installDismissBtn" class="btn btn--blood-primary" type="button">Entendi</button>
            </div>
        </div>
    </div>

    <!-- Trilha compactada a 96 kbps, armazenada localmente para uso offline. -->
    <audio id="bgMusic" src="assets/audio/music-mobile.mp3" preload="metadata" loop></audio>

    <div id="statusBar" class="status-bar" aria-label="Status da partida" hidden>
        <div class="vitality-widget"><span class="hud-label">VIDAS</span><span id="lives" class="life-pips" role="img" aria-label="3 vidas"></span></div>
        <div class="score-widget"><span class="hud-label">PONTOS</span><span id="score" class="score-value">0</span></div>
    </div>


    <!-- Módulos JavaScript -->
    <script type="module" src="script.js"></script>
</body>

</html>
