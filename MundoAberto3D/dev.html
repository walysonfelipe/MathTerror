<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Trilha Sombria — atalhos de teste</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08060a; --panel: #130c10; --card: #1a1014; --line: #3a2220; --line-hot: #ff8a3a;
        --gold: #e8cf98; --text: #d9cbb0; --muted: #9a8b78; --hot: #ff8a3a; --red: #c8281e;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; scroll-padding-top: 76px; }
      body { margin: 0; background: radial-gradient(1200px 500px at 50% -120px, #3a0d0a 0%, transparent 70%), var(--bg); color: var(--text); font: 16px/1.5 Georgia, 'Times New Roman', serif; }
      a { color: inherit; }

      header.hero { max-width: 1120px; margin: 0 auto; padding: 34px 20px 18px; display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
      header.hero img { width: 150px; height: auto; filter: drop-shadow(0 6px 22px #ff2a0055); }
      header.hero h1 { margin: 0; color: var(--gold); font-size: clamp(26px, 4vw, 38px); line-height: 1.1; letter-spacing: .01em; }
      header.hero p { margin: 8px 0 0; color: var(--muted); max-width: 56ch; }
      header.hero kbd { font: 600 13px ui-monospace, Menlo, Consolas, monospace; background: #24161a; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--gold); }

      nav.tabs { position: sticky; top: 0; z-index: 5; background: #08060aee; backdrop-filter: blur(8px); border-block: 1px solid var(--line); }
      nav.tabs div { max-width: 1120px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
      nav.tabs a { flex: none; text-decoration: none; font-size: 14px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--text); white-space: nowrap; }
      nav.tabs a:hover, nav.tabs a:focus-visible { border-color: var(--line-hot); color: var(--gold); outline: none; }

      main { max-width: 1120px; margin: 0 auto; padding: 8px 20px 70px; }
      section { margin-top: 34px; }
      section > h2 { margin: 0; color: var(--gold); font-size: 22px; display: flex; align-items: center; gap: 10px; }
      section > h2::before { content: ''; width: 10px; height: 10px; border-radius: 2px; background: var(--hot); box-shadow: 0 0 12px var(--hot); transform: rotate(45deg); }
      section > p { margin: 4px 0 14px 20px; color: var(--muted); font-size: 15px; }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
      .card { position: relative; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; background: var(--card); border: 1px solid var(--line);
        box-shadow: 0 10px 26px #0009; transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease; }
      .card:hover, .card:focus-within { transform: translateY(-4px); border-color: var(--line-hot); box-shadow: 0 16px 34px #000c, 0 0 0 1px #ff8a3a44, 0 0 34px #ff5a1022; }
      .card .cover { aspect-ratio: 16 / 9; display: block; width: 100%; background: #000; overflow: hidden; }
      .card .cover svg { display: block; width: 100%; height: 100%; transition: transform .5s ease; }
      .card:hover .cover svg { transform: scale(1.06); }
      .card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
      .card h3 { margin: 0; font-size: 18px; color: var(--gold); line-height: 1.2; }
      .card h3 a { text-decoration: none; }
      .card h3 a::after { content: ''; position: absolute; inset: 0; } /* o cartão inteiro é o link */
      .card h3 a:focus-visible { outline: none; }
      .card p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
      .card .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
      .card code { flex: 1; min-width: 0; font: 13px ui-monospace, Menlo, Consolas, monospace; color: var(--hot); background: #0d0709; border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .card button.copy { position: relative; z-index: 1; flex: none; font: 13px Georgia, serif; color: var(--text); background: #24161a; border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
      .card button.copy:hover, .card button.copy:focus-visible { border-color: var(--line-hot); color: var(--gold); outline: none; }
      .card .tag { position: absolute; top: 10px; left: 10px; font: 600 11px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: #000a; border: 1px solid #ffffff30; border-radius: 999px; padding: 3px 9px; }

      .mix { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; padding: 18px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
      .mix label { display: flex; flex-direction: column; gap: 5px; font-size: 14px; color: var(--muted); }
      .mix label.check { flex-direction: row; align-items: center; gap: 7px; padding-bottom: 9px; color: var(--text); }
      .mix select { font: inherit; color: var(--text); background: #0d0709; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 190px; }
      .mix button { font: inherit; color: #fff; background: linear-gradient(180deg, #b0281a, #6a120c); border: 1px solid #d8502a; border-radius: 9px; padding: 9px 26px; cursor: pointer; }
      .mix button:hover { filter: brightness(1.15); }
      .mix output { flex-basis: 100%; font: 13px ui-monospace, Menlo, Consolas, monospace; color: var(--hot); background: #0d0709; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; word-break: break-all; }
      footer { max-width: 1120px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: 13px; }
      @media (max-width: 520px) { header.hero { padding-top: 22px; } header.hero img { width: 104px; } .grid { grid-template-columns: 1fr; } }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .card, .card .cover svg { transition: none; } }
    </style>
  </head>
  <body>
    <header class="hero">
      <img src="./img/logo-trilha-sombria-v3-1024.webp" alt="Trilha Sombria" />
      <div>
        <h1>Atalhos de teste</h1>
        <p>Cada capa abre o jogo já no lugar indicado. Depois da tela de carregamento, é só apertar <kbd>Jogar</kbd>.</p>
      </div>
    </header>
    <nav class="tabs" aria-label="Seções"><div id="tabs"></div></nav>
    <main id="main"></main>
    <footer>Página só para testes. Os endereços usam os parâmetros de teste que o próprio jogo já entende.</footer>

          <path d="M0 150l30 -40l16 22l22 -52l20 44l26 -30l30 46l24 -60l22 50l28 -34l26 38l20 -28l32 44v30H0z" fill="#0a0304"/>
          <rect y="162" width="320" height="18" fill="#ff7a14"/><path d="M0 162q20 -5 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0v4H0z" fill="#ffd27a"/>
          <g fill="#3a0e0c" stroke="#ff4a14" stroke-width="1.5"><rect x="26" y="134" width="96" height="18" rx="4"/><rect x="170" y="134" width="124" height="18" rx="4"/></g>
          <g transform="translate(72 118)"><circle r="15" fill="#e02a1c"/><circle cx="6" cy="-4" r="4.5" fill="#ffd23a"/><circle cx="7.5" cy="-4" r="1.8" fill="#1a0a04"/><path d="M13 0l8 3l-8 3z" fill="#ff9a1a"/></g>
          <g transform="translate(232 112)"><path d="M-12 -18l4 -14l6 12l6 -16l6 16l6 -10l-2 16z" fill="#ff8a1e"/><circle r="13" fill="#e8dcc0"/><ellipse cx="-5" cy="-2" rx="4" ry="4.5" fill="#120403"/><ellipse cx="5" cy="-2" rx="4" ry="4.5" fill="#120403"/><circle cx="-5" cy="-2" r="1.5" fill="#ff5a14"/><circle cx="5" cy="-2" r="1.5" fill="#ff5a14"/><path d="M-6 8h12" stroke="#3a2a1c" stroke-width="2"/></g>`),
        arena: svg(`${sky('g-are', [[0, '#050102'], [0.6, '#4a0e08'], [1, '#1a0403']])}${glow('g-are2', '#ff5a14')}<circle cx="160" cy="84" r="120" fill="url(#g-are2)" opacity=".8"/>
          <rect y="150" width="320" height="30" fill="#2a0806"/><path d="M0 150h320" stroke="#ff4a14" stroke-width="3"/>
          <g transform="translate(88 104)"><path d="M-30 46q-18 -30 -8 -62l-8 -26l18 14q8 -8 16 0l18 -14l-8 26q10 32 -8 62z" fill="#c81e14"/><path d="M-40 -6q-14 6 -12 26l16 4zM40 -6q14 6 12 26l-16 4z" fill="#2a2224"/><circle cx="-9" cy="-10" r="5" fill="#ffd23a"/><circle cx="9" cy="-10" r="5" fill="#ffd23a"/><path d="M-16 -18l12 5M16 -18l-12 5" stroke="#1a0a0a" stroke-width="4"/><text y="22" fill="#ffc86a" font-family="Georgia,serif" font-size="22" font-weight="700" text-anchor="middle">π</text></g>
          <g transform="translate(244 126)"><circle r="22" fill="#e02a1c"/><circle cx="-9" cy="-6" r="6" fill="#ffd23a"/><circle cx="-11" cy="-6" r="2.4" fill="#1a0a04"/><path d="M-19 0l-10 4l10 4z" fill="#ff9a1a"/><path d="M-18 -16l14 5" stroke="#1a0a0a" stroke-width="4"/></g>
          <g font-family="Georgia,serif" font-weight="700" text-anchor="middle"><text x="166" y="78" font-size="34" fill="#ffd27a" stroke="#6a1204" stroke-width="2">VS</text><text x="166" y="38" font-size="15" fill="#ffe8b0">7 × 8 = ?</text></g>`),
      };

      // ------------------------------------------------------------ atalhos
      const SECTIONS = [
        { id: 'normal', title: 'Jogo normal', note: 'A partida do jeito que o jogador vê.', items: [
          { cover: 'jogo', title: 'Jogo completo', text: 'Do começo, com o mundo sorteado.', q: '' },
          { cover: 'vigilia', title: 'Vigília logo no início', text: 'O primeiro ponto de retorno aparece em 26 m.', q: 'vigilia' },
        ] },
        { id: 'mundos', title: 'Mundos da trilha', note: 'A partida começa direto no mundo escolhido.', items: [
          { cover: 'cemiterio', title: 'Cemitério Esquecido', text: 'Lápides, espinhos nos buracos e lua cheia.', q: 'mundo=cemiterio' },
          { cover: 'floresta', title: 'Floresta dos Enforcados', text: 'Mais escuro, aranhas que caem e armadilhas.', q: 'mundo=floresta' },
          { cover: 'pantano', title: 'Pântano Afogado', text: 'Água preta, tábuas que afundam e mãos.', q: 'mundo=pantano' },
        ] },
        { id: 'lugares', title: 'Lugares da trilha', note: 'O lugar escolhido é o primeiro a aparecer, logo no começo da corrida.', items: [
          { cover: 'castelo', title: 'Portão do castelo', text: 'Ande um pouco e entre pelo portão.', q: 'lugar=castelo' },
          { cover: 'fenda', title: 'Fenda', text: 'O portal vermelho que leva à sala da conta.', q: 'lugar=fenda' },
          { cover: 'rio', title: 'Ponte Quebrada', text: 'Some as tábuas certas para atravessar o rio.', q: 'lugar=rio' },
          { cover: 'plano', title: 'Portal da Dimensão Plana', text: 'O portal cor de lava que leva ao mundo 2D.', q: 'lugar=plano' },
          { cover: 'castelo', title: 'Casa do Mago (fachada)', text: 'Ande um pouco e entre pela porta da casa.', q: 'lugar=casa' },
        ] },
        { id: 'castelo', title: 'Castelo por dentro', note: 'Começa já dentro do castelo, sem andar na trilha.', items: [
          { cover: 'castelo', title: 'Hall de Entrada', text: 'O castelo desde a primeira sala.', q: 'castelo' },
          { cover: 'galeria', title: 'Galeria dos Retratos', text: 'Os quadros com números. Portas anteriores abertas.', q: 'sala=galeria' },
          { cover: 'masmorra', title: 'Masmorra', text: 'A balança torta. Portas anteriores abertas.', q: 'sala=masmorra' },
          { cover: 'biblioteca', title: 'Biblioteca Proibida', text: 'Os livros em sequência. Portas anteriores abertas.', q: 'sala=biblioteca' },
          { cover: 'trono', title: 'Sala do Trono', text: 'Já com os pedaços da Chave do Corvo.', q: 'sala=trono' },
          { cover: 'dama', title: 'Dama de Branco', text: 'Ela aparece quase na hora: teste de esconder no armário.', q: 'castelo&damateste' },
        ] },
        { id: 'casa', title: 'Casa do Mago', tag: 'novo', note: 'O Mago fala (voz + legenda), abre o livro e pede o Feitiço da Libertação.', items: [
          { cover: 'castelo', title: 'Casa por dentro', text: 'Começa já dentro da casa: anda até o Mago e ouve a história.', q: 'casa' },
          { cover: 'biblioteca', title: 'Só o feitiço', text: 'Pula a conversa: direto para montar as contas.', q: 'casa&feitico' },
        ] },
        { id: 'plano', title: 'Dimensão Plana', tag: '2D', note: 'O multiverso 2D: corrida na lava e a luta com o boss.', items: [
          { cover: 'plano', title: 'Corrida 2D', text: 'Lava, sombras, caveiras e o último chão que despedaça.', q: 'plano' },
          { cover: 'arena', title: 'Luta com o Guardião', text: 'Pula direto para a arena das contas.', q: 'arena' },
        ] },
      ];

      const url = (q) => './' + (q ? '?' + q : '');
      const main = document.getElementById('main');
      const tabs = document.getElementById('tabs');
      for (const s of SECTIONS) {
        tabs.insertAdjacentHTML('beforeend', `<a href="#${s.id}">${s.title}</a>`);
        main.insertAdjacentHTML('beforeend', `
          <section id="${s.id}">
            <h2>${s.title}</h2><p>${s.note}</p>
            <div class="grid">${s.items.map((it) => `
              <article class="card">
                <span class="cover">${COVERS[it.cover]}</span>
                ${s.tag ? `<span class="tag">${s.tag}</span>` : ''}
                <div class="body">
                  <h3><a href="${url(it.q)}">${it.title}</a></h3>
                  <p>${it.text}</p>
                  <div class="row"><code>${it.q ? '?' + it.q.replace(/&/g, '&amp;') : '/'}</code><button class="copy" type="button" data-q="${it.q}">Copiar</button></div>
                </div>
              </article>`).join('')}
            </div>
          </section>`);
      }
      tabs.insertAdjacentHTML('beforeend', '<a href="#mix">Montar combinação</a>');
      main.insertAdjacentHTML('beforeend', `
        <section id="mix">
          <h2>Montar combinação</h2><p>Junte mundo, primeiro lugar e opções num endereço só.</p>
          <form class="mix" id="mix-form">
            <label>Mundo
              <select name="mundo"><option value="">sorteado</option><option value="cemiterio">Cemitério Esquecido</option><option value="floresta">Floresta dos Enforcados</option><option value="pantano">Pântano Afogado</option></select>
            </label>
            <label>Primeiro lugar
              <select name="lugar"><option value="">sorteado</option><option value="castelo">Castelo</option><option value="fenda">Fenda</option><option value="rio">Ponte Quebrada</option><option value="plano">Dimensão Plana</option><option value="casa">Casa do Mago</option></select>
            </label>
            <label class="check"><input type="checkbox" name="vigilia" /> vigília cedo</label>
            <label class="check"><input type="checkbox" name="damateste" /> Dama aparece rápido</label>
            <button type="submit">Abrir</button>
            <output id="mix-url">./</output>
          </form>
        </section>`);

      // copiar o endereço completo do atalho
      main.addEventListener('click', async (e) => {
        const b = e.target.closest('button.copy');
        if (!b) return;
        const full = new URL(url(b.dataset.q), location.href).href;
        try { await navigator.clipboard.writeText(full); b.textContent = 'Copiado!'; } catch { b.textContent = 'Não deu'; }
        setTimeout(() => { b.textContent = 'Copiar'; }, 1400);
      });

      // monta o endereço a partir das escolhas e mostra antes de abrir
      const form = document.getElementById('mix-form');
      const out = document.getElementById('mix-url');
      const build = () => {
        const parts = [];
        for (const name of ['mundo', 'lugar']) if (form[name].value) parts.push(`${name}=${form[name].value}`);
        for (const name of ['vigilia', 'damateste']) if (form[name].checked) parts.push(name);
        return url(parts.join('&'));
      };
      form.addEventListener('input', () => { out.textContent = build(); });
      form.addEventListener('submit', (e) => { e.preventDefault(); location.href = build(); });
    </script>
  </body>
</html>
